[project]
name = "restorecheck"
version = "0.1.0"
description = "Restore Postgres backups into throwaway containers and verify they actually work."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
restorecheck = "restorecheck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["restorecheck*"]
